<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion entrainements sporteasy</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

    <div class="container">
        
        <!-- Header -->
        <header>
            <div class="logo-area">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-[...]
                </svg>
            </div>
            <h1>Gestion des entrainements sporteasy</h1>
            <div class="subtitle">Gérer les présences et les groupes d'entrainement</div>
        </header>

        <!-- Main Workspace -->
        <div class="tabs">
            <button type="button" class="tab-btn active" data-tab="tab-groups">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.35[...]
                Gestion des groupes
            </button>
            <button type="button" class="tab-btn" data-tab="tab-sporteasy">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m5 5H7a2 2 [...]
                SportEasy
            </button>
        </div>

        <div class="workspace">
            
            <!-- Tab: SportEasy -->
            <div class="tab-panel" id="tab-sporteasy">
            
            <!-- Left panel: Saisie / Input -->
            <div class="panel">
                <div class="panel-title">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707[...]
                    </svg>
                    Source des données
                </div>

                <!-- Manual text area -->
                <div class="textarea-container">
                    <label for="rawTextInput">Coller la liste brute sporteasy ici :</label>
                    <textarea id="rawTextInput" placeholder="Exemple SportEasy :..."></textarea>
                </div>

                <button type="button" class="btn-primary" id="btnProcess" style="width: 100%;">Analyser la liste</button>
            </div>

            <!-- Right panel: Interactive Table & Download -->
            <div class="panel">
                <div class="panel-title">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.3[...]
                    </svg>
                    Liste des joueurs analysée
                </div>

                <!-- Stats summary dashboard -->
                <div class="stats-grid">
                    <div class="stat-card stat-total">
                        <div class="stat-value" id="statTotal">0</div>
                        <div class="stat-label">Total</div>
                    </div>
                    <div class="stat-card stat-present">
                        <div class="stat-value" id="statPresent">0</div>
                        <div class="stat-label">Présents</div>
                    </div>
                    <div class="stat-card stat-waiting">
                        <div class="stat-value" id="statWaiting">0</div>
                        <div class="stat-label">Attente</div>
                    </div>
                    <div class="stat-card stat-absent">
                        <div class="stat-value" id="statAbsent">0</div>
                        <div class="stat-label">Absents</div>
                    </div>
                    <div class="stat-card stat-unselected">
                        <div class="stat-value" id="statUnselected">0</div>
                        <div class="stat-label">Non Retenus</div>
                    </div>
                </div>

                <!-- Player Table -->
                <div class="table-container">
                    <table id="playerTable">
                        <thead>
                            <tr>
                                <th>Nom du Joueur</th>
                                <th>Statut</th>
                            </tr>
                        </thead>
                        <tbody id="playerTableBody">
                            <!-- Dynamically populated rows -->
                            <tr class="table-empty-row">
                                <td colspan="2">
                                    <div class="empty-state">
                                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333[...]
                                        </svg>
                                         <div>Aucun joueur analysé. Collez et analysez une liste à gauche.</div>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- CSV Preview (hidden by default) -->
                <div class="csv-preview" id="csvPreview"></div>

                <!-- Export Section -->
                <div class="export-section">
                    <div class="export-settings">
                        <div class="checkbox-group">
                            <input type="checkbox" id="headerCheckbox" checked>
                            <label for="headerCheckbox">Inclure la ligne d'en-tête (Nom, Statut)</label>
                        </div>
                        <div class="checkbox-group">
                            <input type="checkbox" id="previewCheckbox">
                            <label for="previewCheckbox">Aperçu direct du CSV</label>
                        </div>
                    </div>

                    <div style="display: flex; gap: 1rem; width: 100%;">
                        <button class="btn-export pulse-effect" id="btnExport" style="flex: 1;" disabled>
                            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2[...]
                            </svg>
                            Copier le CSV
                        </button>
                        <button class="btn-secondary" id="btnCopyStatusCol" style="flex: 1; padding: 1rem; font-size: 1.05rem; font-weight: 700; border-color: rgba(99, 102, 241, 0.3); display: in[...]
                            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2[...]
                            </svg>
                            Copier les statuts (P/A/?/N)
                        </button>
                    </div>
                </div>

            </div>

            </div>
        </div>

    </div>
    </div>

            <!-- Tab Groups content -->
            <div class="tab-panel active" id="tab-groups">
                <div class="panel">
                    <div class="panel-title">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8[...]
                        </svg>
                        Paramètres
                    </div>

                    <div style="display: flex; flex-direction: column; gap: 1.5rem;">
                        <button type="button" class="btn-secondary" id="btnConnectSheets" style="width: 100%;">
                            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                            </svg>
                            Charger les données
                        </button>

                        <div>
                            <label for="trainingSelect">Entraînement</label>
                            <select id="trainingSelect" style="width: 100%; background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.1); border-radius: var(--radius-sm); padding: 0.6rem[...]
                                <option value="">-- Sélectionner un entraînement --</option>
                            </select>
                        </div>

                        <div>
                            <label>Nombre de groupes</label>
                            <input type="number" id="groupCount" min="2" max="10" value="3" style="width: 100%; background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.1); border-radiu[...]
                        </div>

                        <div>
                            <label>Niveaux cibles par groupe (A, B ou C)</label>
                            <div id="targetLevels" style="display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.5rem;"></div>
                        </div>

                        <!-- Checkbox removed; the dynamic button "Afficher/Masquer les niveaux" est géré par groups.js -->

                        <button type="button" class="btn-export" id="btnGenerateGroups" style="width: 100%;" disabled>
                            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                            </svg>
                            Générer les groupes
                        </button>

                        <button type="button" class="btn-secondary" id="btnReset" style="width: 100%;">
                            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.[...]
                            </svg>
                            Réinitialiser
                        </button>
                    </div>
                </div>

                <div class="panel">
                    <div class="panel-title">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 01[...]
                        </svg>
                        Résultats
                    </div>
                    <div id="groupsOutput" style="display: flex; flex-direction: column; gap: 1rem;"></div>
                    <button type="button" class="btn-secondary" id="btnCopyGroups" style="width: 100%; margin-top: 1rem;" disabled>
                        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-[...]
                        Copier les groupes
                    </button>
                    <button type="button" class="btn-secondary" id="btnPrintGroups" style="width: 100%; margin-top: 0.5rem;" disabled>
                        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 0[...]
                        Imprimer
                    </button>
                </div>
            </div>
    </div>
    </div>

    <!-- Toast container -->
    <div class="toast" id="toast">
        <span class="toast-icon">
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
        </span>
        <span class="toast-message" id="toastMessage">Texte analysé avec succès !</span>
    </div>

    <!-- Footer -->
    <footer>
        Conçu avec soin pour la gestion sportive &bull; <a href="#" id="btnResetAll">Réinitialiser l'application</a>
    </footer>

    <script src="script.js"></script>
    <script src="toggle-tabs.js"></script>
    <script src="groups.js"></script>
</body>
</html>
